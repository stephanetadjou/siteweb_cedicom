name: Deploy

# Déploiement manuel uniquement : onglet Actions → Deploy → Run workflow,
# sur la branche main. Guide : DEPLOIEMENT_GITHUB.md
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy to production (SSH)
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Les secrets peuvent être rangés dans l'environnement "production"
    # (Settings → Environments), avec relecteurs obligatoires si souhaité.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Clé avec phrase de passe : on l'enlève dans cette copie temporaire du runner.
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/id_deploy > /dev/null
          fi
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Upload build and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PHP_BIN: ${{ vars.PHP_BIN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          test -f public/build/manifest.json
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${SSH_PORT:-22} -o BatchMode=yes"
          rsync -az --delete -e "$SSH" public/build/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/public/build.new/"
          # deploy/remote-deploy.sh : maintenance, sauvegarde mysqldump, git reset
          # sur ce commit, composer, migrate, SiteContentSeeder, caches, droits.
          $SSH "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA' PHP_BIN='${PHP_BIN:-php}' bash -s" \
            < deploy/remote-deploy.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
